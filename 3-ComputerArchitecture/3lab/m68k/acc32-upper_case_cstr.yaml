name: sum_word_pstream
limit: 5000
memory_size: 0x2000
memory_mapped_io:
  0x80: [65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 65, 10]
  0x84: []
reports:
  - name: Step-by-step
    slice: all
    view: |
      {pc:dec}|{pc:hex}: {instruction:next} {pc:label}
  - name: Result
    slice: last
    view: |
      numio[0x80]: {io:0x80:sym}
      numio[0x84]: {io:0x84:sym}
      symio[0x80]: {io:0x80:hex}
      symio[0x84]: {io:0x84:hex}
    


