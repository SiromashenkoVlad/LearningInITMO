name: sum_word_pstream
limit: 2000
memory_size: 0x1000
memory_mapped_io:
  0x80: [4, 2147483647, 1, 2147483647, 1, 0]
  0x84: []
reports:
  - name: Step-by-step
    slice: all
    view: |
      {pc:dec}|{pc:hex}: {instruction:next} {pc:label}
  - name: Result
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
      symio[0x80]: {io:0x80:hex}
      symio[0x84]: {io:0x84:hex}
    


